<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Atlas · Cora</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080c14;color:#e4eaf4;font:14px/1.5 system-ui}button,input,select,textarea{font:inherit;color:inherit;background:#131d2c;border:1px solid #314158;border-radius:7px;padding:7px 11px}button,a,summary{cursor:pointer}button:hover{border-color:#77cddd}button:focus-visible,a:focus-visible{outline:2px solid #77cddd}a{color:#8fd4e3}header{padding:16px 24px;border-bottom:1px solid #243043;display:flex;align-items:center;gap:24px}h1{font-size:21px;margin:0}h1 small{font-weight:400;color:#8093ab;font-size:14px;margin-left:12px}nav{display:flex;gap:8px;flex-wrap:wrap}header nav{margin-left:auto}#search{width:240px}#legend{display:flex;gap:14px;padding:10px 24px;color:#a6b5c9;font-size:12px}.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px}.badge:before{content:'';width:8px;height:8px;border-radius:50%;background:var(--color)}.unknown{--color:#8290a4}.ok{--color:#63d6a0}.plan{--color:#f5d46c}.minor{--color:#ffa35c}.problem{--color:#ff6d7c}#message{margin:0;padding:0 24px;color:#c4d5e8}#message:empty{display:none}.workspace{display:grid;grid-template-columns:minmax(0,1fr) 360px;height:calc(100vh - 120px);min-height:500px}#canvas{position:relative;overflow:hidden;background:radial-gradient(ellipse at 50% 55%,#11213255,transparent 65%)}#map{width:100%;height:100%;touch-action:none}#map text{fill:#c9d5e4;font-family:system-ui;pointer-events:none}#map .node{cursor:pointer;outline:none}#map .node:focus .halo,#map .node:hover .halo{opacity:.6}#map .halo{opacity:.16}#map .edge{stroke:#405873;stroke-width:1;fill:none;opacity:.5}#map .cross{stroke:#79cbd5;stroke-dasharray:4 6;opacity:.7}#inspector{border-left:1px solid #243043;background:#0d1420;padding:24px;overflow:auto}#inspector h2{font-size:22px;line-height:1.3;margin:14px 0}#inspector h3{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#829bb8;margin:26px 0 8px}#inspector p{color:#b3c1d3}#inspector button{margin:4px 4px 4px 0}#inspector ul{padding-left:18px;color:#c0cede}#inspector li{margin:8px 0}.eyebrow{color:#73bac8;font-size:11px;letter-spacing:.12em;text-transform:uppercase}.muted{color:#8293ab;font-size:12px}#controls{position:absolute;bottom:18px;left:22px;display:flex;gap:7px}#results{position:absolute;top:8px;left:20px;max-height:60%;overflow:auto;background:#101a29;z-index:2;max-width:420px}#results:empty{display:none}#results button{display:block;width:100%;text-align:left}#tree{padding:20px;overflow:auto;max-height:80vh}#tree details{margin-left:12px;padding:6px;border-left:1px solid #26374d}#tree article{margin:12px}dialog{width:min(640px,95vw);max-height:90vh;overflow:auto;background:#101a29;color:#e4eaf4;border:1px solid #496178;border-radius:12px;padding:24px}dialog::backdrop{background:#0009}dialog label{display:block;margin:12px 0}dialog input,dialog textarea,dialog select{display:block;width:100%;margin-top:5px}dialog textarea{min-height:95px}#import{display:none}#recovery{padding:10px 24px;background:#242338}#recovery:empty{display:none}[hidden]{display:none!important}@media(max-width:900px){header{flex-wrap:wrap;padding:12px}header nav{margin-left:0}#search{width:190px}.workspace{grid-template-columns:1fr;height:auto}#canvas{height:65vh;min-height:480px}#inspector{border-left:0;border-top:1px solid #243043;max-height:65vh}#legend{flex-wrap:wrap;gap:8px;padding:8px 12px}}
</style></head><body>
<header><h1>Atlas <small>/ Cora</small></h1><input id="search" type="search" placeholder="Cerca nella pianta…" aria-label="Cerca stelle, pianeti e lune"><nav><button id="overview">Costellazione</button><button id="text-view">Vista testuale</button><button id="export">Esporta</button><button id="import-button">Importa</button><input id="import" type="file" accept=".json"><button id="backups">Copie locali</button><button id="add">+ Ramo</button><a href="/index.html">Codice ↗</a></nav></header>
