name: CodeAtlas checks
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Python compilation
        run: python -m compileall -q codeatlas tests
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install UI test dependencies
        run: npm ci --ignore-scripts
      - name: Profiles, evidence and UI tests
        run: npm test
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser test tools (not application dependencies)
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Desktop and constellation browser checks
        run: python tests/browser_smoke.py --output /tmp/codeatlas-qa
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: constellation-browser-checks
          path: /tmp/codeatlas-qa
